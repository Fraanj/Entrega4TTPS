<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl border border-white/10 p-8 relative">
      
      <button (click)="cerrar()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">✕</button>
      
      <h2 class="text-2xl font-bold text-white mb-6">📍 Reportar Avistamiento</h2>
      
      <form [formGroup]="avistamientoForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Comentario *</label>
          <textarea formControlName="comentario" rows="4"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/50"
                    placeholder="Contanos dónde y cuándo viste a la mascota..."></textarea>
        </div>
  
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Foto (opcional)</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)"
                 class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
          <img *ngIf="fotoBase64" [src]="fotoBase64" class="mt-3 h-32 rounded-lg object-cover">
        </div>
  
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Ubicación en el mapa *</label>
          <div id="map-avistamiento" class="h-64 rounded-lg border border-white/10"></div>
          <p class="text-xs text-slate-500 mt-2">📍 Hacé click en el mapa para marcar la ubicación</p>
        </div>
  
        <div class="flex gap-4">
          <button type="button" (click)="cerrar()" 
                  class="flex-1 py-3 bg-white/5 hover:bg-white/10 text-white rounded-lg font-medium transition-all">
            Cancelar
          </button>
          <button type="submit" [disabled]="loading"
                  class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold transition-all disabled:opacity-50">
            {{ loading ? '⏳ Enviando...' : '✅ Reportar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
