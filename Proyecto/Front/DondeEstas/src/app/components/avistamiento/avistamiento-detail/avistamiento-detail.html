<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="w-full max-w-3xl bg-slate-900 rounded-2xl border border-white/10 p-8 relative max-h-[90vh] overflow-y-auto">
      
      <button (click)="cerrar()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">✕</button>
      
      <h2 class="text-2xl font-bold text-white mb-4">📍 Detalle del Avistamiento</h2>
      
      <div class="space-y-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-white font-bold text-lg">{{ avistamiento.mascotaNombre }}</p>
            <p class="text-sm text-slate-400">Reportado por: {{ avistamiento.reportadorNombre }}</p>
            <p class="text-xs text-slate-500">{{ avistamiento.fecha | date:'dd/MM/yyyy HH:mm' }}</p>
          </div>
          <span class="px-3 py-1 bg-indigo-500/20 text-indigo-300 text-xs font-bold rounded-full">
            📍 {{ avistamiento.ubicacion?.barrio || 'Sin ubicación' }}
          </span>
        </div>
  
        <div>
          <p class="text-slate-300">{{ avistamiento.comentario }}</p>
        </div>
  
        <div *ngIf="avistamiento.foto">
          <img [src]="getFotoSegura(avistamiento.foto)" class="w-full rounded-lg">
        </div>
  
        <div *ngIf="avistamiento.ubicacion?.latitud && avistamiento.ubicacion?.longitud">
          <div id="map-detalle-avistamiento" class="h-80 rounded-lg border border-white/10"></div>
        </div>
      </div>
    </div>
  </div>
