<div class="min-h-screen bg-premium-dark p-6 md:p-8 font-sans text-white">
  
  <div class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-white/10 pb-6">
    <div>
      <h1 class="text-3xl font-bold">Mis Publicaciones</h1>
      <p class="text-slate-400 mt-1">Administrá tus mascotas reportadas.</p>
    </div>
    <div class="flex gap-3">
      <button routerLink="/" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors">
        Volver al Inicio
      </button>
      <button routerLink="/mascotas/nueva" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 hover:bg-indigo-500 transition-all hover:scale-105">
        + Nueva Mascota
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-20 text-slate-500 animate-pulse">⏳ Cargando tus mascotas...</div>

  <div *ngIf="!loading && mascotas.length === 0" class="text-center py-20">
    <div class="inline-block rounded-2xl bg-white/5 border border-white/10 p-12">
      <p class="text-slate-400 text-lg mb-4">🐾 No tenés mascotas publicadas.</p>
      <button routerLink="/mascotas/nueva" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-500 transition-all">
        Publicar la primera
      </button>
    </div>
  </div>

  <div *ngIf="!loading && mascotas.length > 0" class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <div *ngFor="let pet of mascotas" 
         class="group bg-slate-900/50 rounded-2xl border border-white/10 overflow-hidden hover:border-indigo-500/50 hover:shadow-2xl hover:shadow-indigo-500/10 transition-all">
      
      <div class="aspect-4/3 bg-slate-800 relative overflow-hidden cursor-pointer"
           [routerLink]="['/mascotas', pet.id]">
        <img *ngIf="pet.fotos?.length > 0" 
             [src]="getFotoSegura(pet.fotos[0])" 
             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
        <div *ngIf="!pet.fotos?.length" 
             class="w-full h-full flex items-center justify-center text-4xl text-slate-600">
          🐾
        </div>
        
        <span [class]="getEstadoClass(pet.estado) + ' absolute top-3 right-3 shadow-lg backdrop-blur-md'">
          {{ getEstadoLabel(pet.estado) }}
        </span>
      </div>

      <div class="p-5">
        <h3 class="font-bold text-xl text-white truncate mb-1">{{ pet.nombre }}</h3>
        <p class="text-sm text-slate-400 mb-3 flex items-center gap-1">
          📍 {{ pet.ubicacion?.barrio || 'Sin ubicación' }}
        </p>
        
        <p class="text-sm text-slate-500 line-clamp-2 h-10 mb-4">{{ pet.descripcion }}</p>
        
        <div class="pt-4 border-t border-white/5 grid grid-cols-2 gap-2">
          <button [routerLink]="['/mascotas/editar', pet.id]" 
                  class="flex items-center justify-center gap-1 px-3 py-2 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white font-medium rounded-lg transition-all text-sm">
            ✏️ Editar
          </button>
          <button (click)="eliminar(pet.id)" 
                  class="flex items-center justify-center gap-1 px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 font-medium rounded-lg transition-all text-sm">
            🗑️ Eliminar
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
