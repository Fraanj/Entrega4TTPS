<div class="min-h-screen bg-premium-dark p-6 font-sans text-white">
  <div class="max-w-6xl mx-auto">
    
    <div class="mb-8 flex items-center justify-between border-b border-white/10 pb-6">
      <div>
        <h1 class="text-3xl font-bold">📋 Gestión de Publicaciones</h1>
        <p class="text-slate-400 mt-1">Todas las mascotas reportadas en el sistema</p>
      </div>
      <a routerLink="/admin/usuarios" class="px-4 py-2 rounded-lg border border-white/10 hover:bg-white/10 transition-colors">
        Ver Usuarios
      </a>
    </div>

    <div *ngIf="loading" class="py-20 text-center text-slate-500 animate-pulse">Cargando publicaciones...</div>
    <div *ngIf="error" class="py-10 text-center text-red-400 bg-red-500/10 rounded-xl">{{ error }}</div>

    <div *ngIf="!loading && !error" class="rounded-2xl border border-white/10 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-white/5 border-b border-white/10">
            <tr>
              <th class="px-6 py-4 text-xs font-bold uppercase text-slate-400">Foto</th>
              <th class="px-6 py-4 text-xs font-bold uppercase text-slate-400">Nombre</th>
              <th class="px-6 py-4 text-xs font-bold uppercase text-slate-400">Estado</th>
              <th class="px-6 py-4 text-xs font-bold uppercase text-slate-400">Ubicación</th>
              <th class="px-6 py-4 text-xs font-bold uppercase text-slate-400 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let m of mascotas" class="border-b border-white/5 hover:bg-white/5 transition-colors">
              <td class="px-6 py-4">
                <div class="h-12 w-12 rounded-lg overflow-hidden bg-slate-800 border border-white/10">
                  <img *ngIf="m.fotos?.length" [src]="getFotoSegura(m.fotos[0])" class="h-full w-full object-cover" alt="">
                  <div *ngIf="!m.fotos?.length" class="h-full w-full flex items-center justify-center text-xl">🐾</div>
                </div>
              </td>
              <td class="px-6 py-4 font-medium">{{ m.nombre }}</td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 rounded text-xs font-bold bg-slate-500/20 text-slate-300">
                  {{ getEstadoLabel(m.estado) }}
                </span>
              </td>
              <td class="px-6 py-4 text-slate-400">{{ m.ubicacion?.barrio || '—' }}</td>
              <td class="px-6 py-4 text-right">
                <a [routerLink]="['/mascotas', m.id]" class="inline-block px-3 py-1.5 rounded-lg text-sm font-medium text-indigo-400 hover:bg-indigo-500/20 mr-2">
                  Ver
                </a>
                <button (click)="eliminar(m)" [disabled]="eliminandoId === m.id"
                        class="px-3 py-1.5 rounded-lg text-sm font-medium border border-red-500/50 text-red-300 hover:bg-red-500/20 disabled:opacity-50">
                  Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngIf="mascotas.length === 0" class="py-12 text-center text-slate-500">No hay publicaciones.</div>
    </div>

  </div>
</div>
