<div class="flex min-h-full items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    
    <!-- Card del Login -->
    <div class="rounded-2xl border border-white/10 bg-white/5 p-8 backdrop-blur-xl shadow-2xl">
      
      <!-- Header -->
      <div class="mb-8 text-center">
        <div class="mb-4 flex justify-center">
          <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-3xl shadow-lg shadow-indigo-500/30">
            🐶
          </div>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">Iniciar Sesión</h2>
        <p class="mt-2 text-sm text-slate-400">Bienvenido de vuelta a ¿Dónde estás?</p>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="onLogin()" class="space-y-6">
        
        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-300">
            Email
          </label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="correo@ejemplo.com"
            required
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder-slate-500 transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          />
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-slate-300">
            Contraseña
          </label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            required
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder-slate-500 transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          />
        </div>

        <!-- Mensaje de error -->
        <div 
          *ngIf="errorMessage" 
          class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
          <span class="mr-2">⚠️</span>{{ errorMessage }}
        </div>

        <!-- Botón de envío -->
        <button 
          type="submit" 
          [disabled]="isLoading"
          class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-3 font-bold text-white shadow-lg shadow-indigo-500/30 transition-all hover:shadow-xl hover:shadow-indigo-500/50 hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
          <span *ngIf="!isLoading">🔑 Ingresar</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="h-5 w-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Cargando...
          </span>
        </button>
      </form>

      <!-- Link de registro -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-400">
          ¿No tienes cuenta? 
          <a 
            routerLink="/register" 
            class="font-semibold text-indigo-400 transition-colors hover:text-indigo-300">
            Regístrate aquí
          </a>
        </p>
      </div>

    </div>

  </div>
</div>
