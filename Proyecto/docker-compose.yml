services:

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234567!
      MYSQL_DATABASE: mibd
    ports:
      - "3307:3306"   # 3307 en el host para evitar conflicto con MySQL local
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p1234567! --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  backend:
    build: ./API
    container_name: java-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: mibd
      DB_USER: root
      DB_PASSWORD: 1234567!
    restart: always
  frontend:
    build:
      context: ./Front/DondeEstas
      dockerfile: Dockerfile
    container_name: angular-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: always


volumes:
  db_data:

